<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#17352b"><meta name="description" content="Tu entrenamiento de hoy y tu plan de running en PaceUp."><link rel="manifest" href="/manifest.webmanifest"><title>PaceUp — Plan de running</title><style>
body{margin:0;background:#f2f5f0}
.boot{position:fixed;inset:0;z-index:30;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;box-sizing:border-box;padding:32px;font-family:system-ui,-apple-system,sans-serif;text-align:center;color:#f6faef;background:radial-gradient(ellipse at 50% 30%,#284b33 0%,#132e24 46%,#0c1f19 100%)}
.boot::before,.boot::after{content:"";position:absolute;width:min(115vw,740px);height:min(115vw,740px);border:1px solid #c7f27812;border-radius:50%;pointer-events:none}
.boot::before{transform:translateY(4%);box-shadow:0 0 0 55px #c7f27805,0 0 0 110px #c7f27803}
.boot::after{width:min(78vw,510px);height:min(78vw,510px);border-style:dashed;border-color:#c7f27818;animation:boot-orbit 60s linear infinite}
.boot>*{position:relative;z-index:1}
.boot-mark{display:flex;align-items:flex-end;justify-content:center;gap:9px;width:94px;height:94px;background:#c7f278;border-radius:28px;box-sizing:border-box;padding:25px;transform:rotate(-6deg);box-shadow:0 16px 60px #0004,0 0 65px #c7f27815}
.boot-mark i{display:block;width:9px;border-radius:5px;background:#17352b;animation:boot-pulse 1.8s ease-in-out infinite}
.boot-mark i:nth-child(1){height:18px}.boot-mark i:nth-child(2){height:29px;animation-delay:.15s}.boot-mark i:nth-child(3){height:42px;animation-delay:.3s}
.boot h1{font:800 clamp(44px,9vw,64px)/1.05 system-ui,sans-serif;color:#f6faef;margin:28px 0 13px;letter-spacing:-.07em}
.boot p{max-width:310px;color:#b9ccba;margin:0 0 35px;font-size:15px;line-height:1.6}
.boot-progress{height:3px;width:132px;background:#c7f27818;border-radius:4px;overflow:hidden}
.boot-progress span{display:block;height:100%;width:42%;background:#c7f278;border-radius:4px;animation:boot-slide 1.6s ease-in-out infinite}
.boot small{margin-top:18px;color:#93aa95;font-size:11px;letter-spacing:.03em}
.boot-footer{position:absolute;bottom:max(28px,env(safe-area-inset-bottom));color:#78937b;font-size:9px;letter-spacing:.22em;text-transform:uppercase}
@keyframes boot-pulse{50%{transform:translateY(-4px);opacity:.6}}
@keyframes boot-slide{0%{transform:translateX(-110%)}100%{transform:translateX(345%)}}
@keyframes boot-orbit{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.boot-mark i,.boot-progress span,.boot::after{animation:none}}
</style></head><body><div id="app"><main class="boot" aria-label="Cargando PaceUp"><div class="boot-mark" aria-hidden="true"><i></i><i></i><i></i></div><h1>PaceUp</h1><p>Tu próximo paso empieza acá.</p><div class="boot-progress" aria-hidden="true"><span></span></div><small role="status">Preparando tu plan…</small><span class="boot-footer">Tu ritmo. Tu camino.</span></main></div><script type="module" src="/src/main.js"></script></body></html>
