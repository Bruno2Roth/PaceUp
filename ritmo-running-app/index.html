<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#17352b"><meta name="description" content="Tu entrenamiento de hoy y tu plan de running en PaceUp."><link rel="manifest" href="/manifest.webmanifest"><title>PaceUp — Plan de running</title><style>
body{margin:0;background:#f2f5f0}.boot{min-height:100svh;display:grid;place-content:center;justify-items:center;font-family:system-ui,sans-serif;color:#17352b;text-align:center;padding:24px;box-sizing:border-box;background:radial-gradient(ellipse at 50% 40%,#dceec3,transparent 58%),#f2f5f0}.boot-mark{display:flex;align-items:flex-end;justify-content:center;gap:8px;width:84px;height:84px;background:#17352b;border-radius:26px;box-sizing:border-box;padding:22px;box-shadow:0 18px 50px #17352b25}.boot-mark i{width:9px;border-radius:4px;background:#c7f278;animation:boot-pulse 1.4s ease-in-out infinite}.boot-mark i:nth-child(1){height:18px}.boot-mark i:nth-child(2){height:28px;animation-delay:.15s}.boot-mark i:nth-child(3){height:40px;animation-delay:.3s}.boot h1{font-size:42px;margin:22px 0 10px;letter-spacing:-2px}.boot p{color:#63766a;margin:0 0 24px}.boot-progress{height:4px;width:160px;background:#d4dfcc;border-radius:4px;overflow:hidden}.boot-progress span{display:block;height:100%;width:45%;background:#6f9941;animation:boot-slide 1.3s ease-in-out infinite}.boot small{margin-top:16px;color:#738078}@keyframes boot-pulse{50%{opacity:.45;transform:translateY(-4px)}}@keyframes boot-slide{from{transform:translateX(-100%)}to{transform:translateX(330%)}}@media(prefers-reduced-motion:reduce){.boot-mark i,.boot-progress span{animation:none}}
</style></head><body><div id="app"><main class="boot" aria-label="Cargando PaceUp"><div class="boot-mark" aria-hidden="true"><i></i><i></i><i></i></div><h1>PaceUp</h1><p>Tu próximo entrenamiento, más claro.</p><div class="boot-progress" aria-hidden="true"><span></span></div><small role="status">Preparando tu espacio de running…</small><noscript><p>Activá JavaScript para cargar tu plan de entrenamiento.</p></noscript></main></div><script type="module" src="/src/main.js"></script></body></html>
